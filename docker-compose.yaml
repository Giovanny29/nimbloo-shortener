services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: nimbloo-dynamodb
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ."
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nimbloo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3.8.1
    container_name: nimbloo-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
      - DISABLE_EVENTS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nimbloo-backend
    ports:
      - "8080:8080"
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - SQS_ENDPOINT=http://localstack:4566
      - REDIS_HOST=redis
      - AWS_REGION=us-east-1
    depends_on:
      dynamodb-local:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy